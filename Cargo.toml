[package]
name = "pico-wasm-stark-verifier"
version = "0.1.7"
edition = "2021"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
pico-vm = { git = "https://github.com/brevis-network/pico.git", branch = "ethproofs-pico-v2.0.0" }
# pico-prism-vm = { git = "https://github.com/brevis-network/pico.git", package = "pico-vm", branch = "main" }
pico-prism-vm = { git = "https://github.com/ethproofs/pico.git", package = "pico-vm", branch = "ethproofs-pico-prism" }
# Pico 3.0 (MLE/WHIR), see src/pico_mle.rs.
pico-mle-vm = { git = "https://github.com/brevis-network/pico.git", package = "pico-vm", tag = "v3.0.0", default-features = false }
pico-mle-core = { git = "https://github.com/brevis-network/pico.git", tag = "v3.0.0", default-features = false }

# Wasm bindings
wasm-bindgen = "0.2"
js-sys = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
bincode = "1.3.3"
# zstd decoding without C, for the Pico 3.0 framing
ruzstd = "0.8"

# Error handling
anyhow = "1.0"

# Console logging for debugging
console_error_panic_hook = "0.1"

# Fix for getrandom in Wasm
getrandom = { version = "0.2", features = ["js"] }

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
]

# getrandom 0.3 and 0.4, which Pico 3.0 pulls in, need their `wasm_js` feature on wasm32. From
# 0.3.4 on, the feature alone selects that backend.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom03 = { package = "getrandom", version = "0.3.4", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4.3", features = ["wasm_js"] }

# Optimize for size in release builds
[profile.release]
opt-level = "s"
lto = true
